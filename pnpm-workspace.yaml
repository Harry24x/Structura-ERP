# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  core-js: false
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  sharp: 0.35.5
  next: 16.4.1
  ws: 8.21.0
  undici: 7.30.1
  js-yaml@^4: 4.3.2
  '@babel/core@^7': 7.29.6
  brace-expansion@^1: 1.1.21
  brace-expansion@^5: 5.0.12
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  fflate@^0.7: 0.7.5
  fast-uri: 3.1.9
  image-size: 2.0.3
  source-map-js: 1.2.2
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  # The published Drizzle bundle uses tsx; this abandoned loader is unused.
  'drizzle-kit@0.31.10>@esbuild-kit/esm-loader': '-'
  # Both are supported by the installed react-hooks plugin's declared ranges.
  'eslint-plugin-react-hooks>zod': 4.6.6
  'eslint-plugin-react-hooks>zod-validation-error': 4.0.2
  # Keep the framework, but use the maintained OG/Satori pair with SVG escaping.
  'vinext>@vercel/og': 1.0.3
  # Match the Vite plugin and CLI runtime instead of installing two registries.
  '@cloudflare/vite-plugin>wrangler': 4.151.1
  '@cloudflare/vite-plugin>miniflare': 5.20261012.1-beta
patchedDependencies:
  '@vercel/og@1.0.3': patches/@vercel__og@1.0.3.patch
  wrangler@4.151.1: patches/wrangler@4.151.1.patch
